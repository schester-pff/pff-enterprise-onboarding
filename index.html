// Wave particle background
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

const DOTS=380;
const dots=[];
for(let i=0;i<DOTS;i++){
  const prog=i/DOTS;
  dots.push({
    prog,
    xOff:Math.random()*0.04-0.02,
    yOff:Math.random()*20-10,
    size:Math.random()*1.8+0.4,
    speed:Math.random()*0.3+0.15,
    phase:Math.random()*Math.PI*2,
    band:Math.floor(Math.random()*4)-1
  });
}
let wt=0;
function wavY(prog,t,band){
  const x=prog*Math.PI*3;
  return Math.sin(x+t*0.4+band*0.8)*0.07
       + Math.sin(x*1.7+t*0.25+band*0.5)*0.035
       + Math.sin(x*0.5+t*0.15)*0.025;
}
function drawBg(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  // Subtle glow behind wave
  const glow=ctx.createRadialGradient(W*0.5,H*0.18,0,W*0.5,H*0.18,W*0.55);
  glow.addColorStop(0,'rgba(20,30,120,0.3)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  // Dots
  dots.forEach(d=>{
    const p=d.prog+d.xOff;
    const wv=wavY(p,wt+d.phase*0.3,d.band);
    const x=p*W;
    const y=((0.18+wv)*H)+(d.yOff)+(Math.sin(wt*d.speed+d.phase)*3);
    const prog=d.prog;
    let r,g,b;
    if(prog<0.5){const m=prog*2;r=Math.round(m*60);g=Math.round(200-m*120);b=Math.round(200+m*55);}
    else{const m=(prog-0.5)*2;r=Math.round(60+m*80);g=Math.round(80-m*50);b=255;}
    const a=Math.random()>0.08?0.7+Math.random()*0.3:0.15;
    const bandFade=Math.max(0,1-Math.abs(d.yOff)/12);
    ctx.beginPath();
    ctx.arc(x,y,d.size*bandFade,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${a*bandFade})`;
    ctx.fill();
  });
  wt+=0.018;
  requestAnimationFrame(drawBg);
}
drawBg();

    {title:"Section 2 — Onboarding",startNum:10,qs:[
      {id:"right_to_work",text:"Do you have the right to work as a contractor in your country of residence?",type:"radio",opts:["Yes","No","I'm not sure"]},
      {id:"slack_confirm",text:"I understand I need to join Slack before the 2026 season and will do so when I receive my invite.",type:"radio",opts:["Yes, I confirm","I have questions about this"]},
      {id:"docs_confirm",text:"I understand I need to sign updated HR onboarding documents and will do so when they are sent to me.",type:"radio",opts:["Yes, I confirm","I have questions about this"]},
    ]},
    {title:"Section 3 — Survey",qs:[
      {id:"processes",text:"Which processes are you currently trained in?\nSelect all that apply.",type:"multicheck",opts:PROCESSES},
      {id:"processes_learning",text:"Which processes are you training in this offseason?\nSelect all that apply.",type:"multicheck",opts:PROCESSES},
      {id:"total_games_last_season",text:"How many game assignments did you work in total last season?",type:"select",opts:TOTAL_GAMES_OPTS},
      {id:"avg_games_per_week",text:"On average, how many game assignments did you work per week last season?",type:"select",opts:AVG_WEEKLY_OPTS},
      {id:"preferred_games_per_week",text:"If you could choose, how many game assignments would you ideally like to work per week this season?",type:"select",opts:AVG_WEEKLY_OPTS},
      {id:"workload_preference",text:"What would you like your overall workload to look like this season compared to last?",type:"radio",opts:["Fewer game assignments than last season","About the same as last season","More game assignments than last season"]},
    ]},
    ...(hasProcs?[{title:"Section 4 — Time Per Process",isTimeSection:true,qs:processTimeQs}]:[]),
    {title:`Section ${4+n} — Availability`,qs:[
      {id:"availability",text:"For each day of the week, select the number of hours you are typically available to work.\nThis helps us with scheduling — please be as accurate as possible.",type:"availability"},
    ]},
    {title:`Section ${5+n} — Ideal Weekly Schedule`,isSchedule:true,qs:[]},
    {title:`Section ${6+n} — Equipment`,qs:[
      {id:"dual_monitor",text:"Do you use a dual monitor setup when collecting data for games?",type:"radio",opts:["Yes","No"]},
      {id:"os",text:"What operating system do you use?",type:"radio",opts:OS_OPTS},
      {id:"hardware_notes",text:"Any additional hardware details you would like us to know about?",type:"text",ph:"Optional — leave blank if not applicable",optional:true},
      {id:"questions_for_us",text:"Do you have any questions for us?\nIf so, please use the box below and we will do our best to get back to you.",type:"textarea",ph:"Type your question here — or leave blank if you have nothing to ask right now.",optional:true},
    ]},
  ];
}


function getAvailableProcesses(){
  const trained=answers['processes']||[];
  const learning=answers['processes_learning']||[];
  const combined=[...new Set([...trained,...learning])];
  return combined.filter(p=>p);
}

function renderScheduleSection(s,prog,isLast){
  const availProcs=getAvailableProcesses();
  const days=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];

  // Build reference table
  const maxRows=Math.max(...Object.values(SCHEDULE_DATA).map(a=>a.length));
  let tableRows='';
  for(let i=0;i<maxRows;i++){
    tableRows+=`<tr>${days.map(d=>`<td>${SCHEDULE_DATA[d][i]||''}</td>`).join('')}</tr>`;
  }

  // Build grid columns — one per day
  const procOpts=availProcs.length===0
    ?`<option value="">— No processes —</option>`
    :`<option value=""></option>${availProcs.map(p=>`<option value="${p}">${p}</option>`).join('')}`;

  const gridCols=days.map(day=>{
    const slots=schedule[day];
    const displayCount=Math.max(5,slots.length);
    let slotsHtml='';
    for(let i=0;i<displayCount;i++){
      const val=slots[i]?slots[i].process:'';
      const filled=!!val;
      slotsHtml+=`<div class="grid-slot${filled?' filled':''}">
        <select class="slot-select" data-day="${day}" data-idx="${i}" onchange="setSlot('${day}',${i},this.value)">
          <option value=""></option>${availProcs.map(p=>`<option value="${p}"${val===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </div>`;
    }
    return`<div class="grid-col">
      <div class="grid-day-header">${day}</div>
      <div class="grid-slots" id="slots-${day}">${slotsHtml}</div>
      <button class="btn-add-slot" onclick="addSlot('${day}')">+ Add slot</button>
    </div>`;
  }).join('');

  document.getElementById('page-form').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:1.5rem 0 1rem">
    <h2 style="color:#fff;font-size:22px;font-weight:700;margin:0 0 1rem">${s.title}</h2>
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${prog}%"></div></div>
    <p style="color:#9ca3af;font-size:13px">Section ${currentSec+1} of ${buildSections().length} — ${s.title}</p>
  </div>
  <div class="screener-card">
    <h3 style="color:#1A6AFF;font-size:17px;font-weight:700;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(255,255,255,0.1)">${s.title}</h3>
    <p style="color:#d1d5db;font-size:14px;line-height:1.7;margin-bottom:1.25rem">Use the grid below to build your ideal weekly schedule. Each slot represents one game assignment — select a process from the dropdown. Add as many slots as you like on any day using the button at the bottom of that column. This is your ideal — be as ambitious as you like, there are no wrong answers.</p>

    <div class="schedule-reference">
      <h3>Process in-season days worked — for reference</h3>
      <div style="overflow-x:auto">
        <table class="ref-table">
          <thead><tr>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>

    ${availProcs.length===0?`<div class="info-box"><p>You have not selected any processes in Section 3. Go back and select the processes you are trained in or learning this offseason — they will then appear here.</p></div>`:''}

    <p style="color:#9ca3af;font-size:13px;line-height:1.6;margin-bottom:0.75rem">Each slot represents one full game assignment. If you want multiple games in the same process on the same day, just fill multiple slots with that process. Leave slots blank on days you do not want to work, or if you only want a limited number of games that day.</p>

    <div class="week-grid" id="week-grid">${gridCols}</div>

    <div class="q-block" style="margin-top:1.5rem;margin-bottom:0">
      <label class="q-label">Any additional notes about your schedule preferences?<br><span style="color:#9ca3af;font-size:13px;font-weight:400">e.g. half games vs full games, specific time windows, process combinations you prefer, anything else we should know.</span></label>
      <textarea class="q-textarea" rows="4" placeholder="Optional — leave blank if you have nothing to add." oninput="setAnswer('schedule_notes',this.value)">${answers['schedule_notes']||''}</textarea>
    </div>
  </div>
  <div id="err-msg" class="error-msg" style="display:none">Please answer all required questions before continuing.</div>
  <div class="nav-row">
    <button class="btn-back" onclick="${currentSec>0?'prevSec()':'backToWelcome()'}">Back</button>
    <button class="btn-next" id="btn-next" onclick="nextOrSubmit()">${isLast?'Submit Form':'Next Section'}</button>
  </div>
  <p class="hint">All required questions must be answered before proceeding</p>`;
}

function setSlot(day,idx,val){
  if(!schedule[day])schedule[day]=[];
  while(schedule[day].length<=idx)schedule[day].push({process:''});
  schedule[day][idx]={process:val};
  // Just toggle the filled class on the parent slot div — no re-render
  const container=document.getElementById('slots-'+day);
  if(container){
    const slotDivs=container.querySelectorAll('.grid-slot');
    if(slotDivs[idx]){
      if(val){slotDivs[idx].classList.add('filled');}
      else{slotDivs[idx].classList.remove('filled');}
    }
  }
}

function addSlot(day){
  if(!schedule[day])schedule[day]=[];
  schedule[day].push({process:''});
  const idx=schedule[day].length-1;
  const availProcs=getAvailableProcesses();
  const container=document.getElementById('slots-'+day);
  if(!container)return;
  const div=document.createElement('div');
  div.className='grid-slot';
  const sel=document.createElement('select');
  sel.className='slot-select';
  sel.setAttribute('data-day',day);
  sel.setAttribute('data-idx',idx);
  sel.onchange=function(){setSlot(day,idx,this.value);};
  const emptyOpt=document.createElement('option');
  emptyOpt.value='';
  sel.appendChild(emptyOpt);
  availProcs.forEach(p=>{
    const opt=document.createElement('option');
    opt.value=p;opt.textContent=p;
    sel.appendChild(opt);
  });
  div.appendChild(sel);
  container.appendChild(div);
}


function showForm(){
  document.getElementById('page-welcome').style.display='none';
  document.getElementById('page-form').style.display='block';
  currentSec=0;renderSection();window.scrollTo({top:0,behavior:'smooth'});
}

function renderSection(){
  const sections=buildSections();
  const s=sections[currentSec];
  const prog=Math.round(((currentSec+1)/sections.length)*100);
  const isLast=currentSec===sections.length-1;

  if(s.isSchedule){renderScheduleSection(s,prog,isLast);return;}

  let qNum=s.startNum||1;
  const qHtml=s.qs.map(q=>{
    if(q.type==='infolink')return`<div class="info-box"><p>Interested in learning a new All-22 process this offseason? <a href="https://profootballfocus.fillout.com/forms" target="_blank" rel="noopener" style="color:#1A6AFF;font-weight:700">Sign up here</a> — let us know which process you would like to add to your repertoire and we will be in touch with details.</p></div>`;
    const num=qNum++;
    const v=answers[q.id]||'';
    let input='';
    if(q.type==='radio'){
      input=q.opts.map(o=>`<div class="radio-opt${v===o?' selected':''}" onclick="setRadio('${q.id}','${o.replace(/'/g,"\\'").replace(/"/g,"&quot;")}',this)"><div class="radio-dot">${v===o?'<div class="radio-inner"></div>':''}</div><span class="radio-text">${o}</span></div>`).join('');
    }else if(q.type==='select'){
      input=`<select class="q-select" onchange="setAnswer('${q.id}',this.value);${q.id==='timezone'?'handleTimezoneOther(this.value)':''}"><option value="">Select...</option>${q.opts.map(o=>`<option value="${o}"${v===o?' selected':''}>${o}</option>`).join('')}</select>`;
      if(q.id==='timezone'&&v==='Other')input+=`<input class="q-text" type="text" placeholder="Please describe your time zone..." value="${answers['timezone_other']||''}" oninput="setAnswer('timezone_other',this.value)" style="margin-top:10px">`;
    }else if(q.type==='text'){
      input=`<input class="q-text" type="text" placeholder="${q.ph||''}" value="${v}" oninput="setAnswer('${q.id}',this.value)">`;
      if(q.optional)input+=`<p class="q-hint">Optional</p>`;
    }else if(q.type==='textarea'){
      input=`<textarea class="q-textarea" rows="4" placeholder="${q.ph||''}" oninput="setAnswer('${q.id}',this.value)">${v}</textarea>`;
      if(q.optional)input+=`<p class="q-hint">Optional</p>`;
    }else if(q.type==='initials'){
      input=`<input class="q-text" type="text" value="${v}" maxlength="3" oninput="setInitials(this)" style="text-transform:uppercase;letter-spacing:4px;font-size:20px;font-weight:700;max-width:120px">`;
    }else if(q.type==='multicheck'){
      const arr=answers[q.id]||[];
      input=`<div style="display:flex;flex-wrap:wrap;gap:0">${q.opts.map(o=>`<button class="check-btn${arr.includes(o)?' selected':''}" onclick="toggleCheck('${q.id}','${o}')">${o}</button>`).join('')}</div>`;
    }else if(q.type==='processtime'){
      const opts=PROCESS_TIMES[q.process]||[];
      input=`<select class="q-select" onchange="setAnswer('${q.id}',this.value);handleProcessTimeOther('${q.id}',this.value)"><option value="">Select...</option>${opts.map(o=>`<option value="${o}"${v===o?' selected':''}>${o}</option>`).join('')}</select>`;
      if(v==='Other')input+=`<input class="q-text" type="text" placeholder="Please describe your typical game time..." value="${answers[q.id+'_other']||''}" oninput="setAnswer('${q.id+'_other'}',this.value)" style="margin-top:10px">`;
    }else if(q.type==='availability'){
      const av=answers['availability']||{};
      input=`<div class="avail-grid">${DAYS.map(d=>`<div class="avail-row"><span class="avail-day">${d}</span><div class="avail-opts">${HOURS.map(h=>`<button class="avail-btn${av[d]===h?' selected':''}" onclick="setAvail('${d}','${h.replace(/'/g,"\\'")}')">${h}</button>`).join('')}</div></div>`).join('')}</div>`;
    }
    return`<div class="q-block"><label class="q-label"><span class="q-num">${num}.</span>${q.text}</label>${input}</div>`;
  }).join('');

  const timeSectionNote=s.isTimeSection?`<div class="info-box" style="margin-bottom:1.5rem"><p>How long does it take you to complete a normal game assignment in each process listed below? If you are more used to doing half games, please double your time when filling in that section.</p><p style="margin-top:0.75rem">Please be honest with this. If we are going to give you multiple games in a day, we need to understand how long each assignment actually takes you — so we do not overload your schedule, or shortchange you if you work faster than average.</p></div>`:'';

  document.getElementById('page-form').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:1.5rem 0 1rem">
    <h2 style="color:#fff;font-size:22px;font-weight:700;margin:0 0 1rem">${s.title}</h2>
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${prog}%"></div></div>
    <p style="color:#9ca3af;font-size:13px">Section ${currentSec+1} of ${sections.length} — ${s.title}</p>
  </div>
  <div class="screener-card">
    <h3 style="color:#1A6AFF;font-size:17px;font-weight:700;margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(255,255,255,0.1)">${s.title}</h3>
    ${timeSectionNote}
    ${qHtml}
  </div>
  <div id="err-msg" class="error-msg" style="display:none">Please answer all required questions before continuing.</div>
  <div class="nav-row">
    <button class="btn-back" onclick="${currentSec>0?'prevSec()':'backToWelcome()'}">Back</button>
    <button class="btn-next" id="btn-next" onclick="nextOrSubmit()">${isLast?'Submit Form':'Next Section'}</button>
  </div>
  <p class="hint">All required questions must be answered before proceeding</p>`;
}


function handleTimezoneOther(val){if(val!=='Other')answers['timezone_other']='';renderSection();}
function handleProcessTimeOther(id,val){if(val!=='Other')answers[id+'_other']='';renderSection();}
function setInitials(el){const val=el.value.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,3);el.value=val;answers['initials']=val;}
function setRadio(id,val,el){
  answers[id]=val;
  el.closest('.screener-card').querySelectorAll('.radio-opt').forEach(o=>{if(o.closest('.q-block')===el.closest('.q-block')){o.classList.remove('selected');o.querySelector('.radio-dot').innerHTML='';}});
  el.classList.add('selected');el.querySelector('.radio-dot').innerHTML='<div class="radio-inner"></div>';
}
function setAnswer(id,val){answers[id]=val;}
function setAvail(day,hrs){if(!answers['availability'])answers['availability']={};answers['availability'][day]=hrs;renderSection();}
function toggleCheck(id,val){const arr=answers[id]||[];answers[id]=arr.includes(val)?arr.filter(x=>x!==val):[...arr,val];renderSection();}

function secComplete(){
  const sections=buildSections();
  const s=sections[currentSec];
  if(s.isSchedule)return true; // schedule section is optional
  return s.qs.every(q=>{
    if(q.type==='infolink')return true;
    if(q.optional)return true;
    if(q.type==='multicheck')return(answers[q.id]||[]).length>0;
    if(q.type==='availability'){const av=answers['availability']||{};return DAYS.every(d=>av[d]);}
    if(q.type==='initials')return(answers[q.id]||'').length===3;
    if(q.type==='processtime'){
      if(!answers[q.id])return false;
      if(answers[q.id]==='Other')return(answers[q.id+'_other']||'').trim().length>0;
      return true;
    }
    return answers[q.id]!==undefined&&answers[q.id]!=='';
  });
}

function nextOrSubmit(){
  if(!secComplete()){
    const err=document.getElementById('err-msg');
    if(err){err.style.display='block';}
    return;
  }
  if(currentSec===0&&answers['continuation']==='No — I do not wish to continue'){submitForm();return;}
  const sections=buildSections();
  if(currentSec===sections.length-1){submitForm();return;}
  currentSec++;renderSection();window.scrollTo({top:0,behavior:'smooth'});
}

function prevSec(){currentSec--;renderSection();window.scrollTo({top:0,behavior:'smooth'});}
function backToWelcome(){document.getElementById('page-form').style.display='none';document.getElementById('page-welcome').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}

function buildSchedulePayload(){
  const parts=[];
  Object.entries(schedule).forEach(([day,slots])=>{
    const filled=slots.filter(s=>s&&s.process);
    if(filled.length>0){
      parts.push(`${day}: ${filled.map(s=>s.process).join(', ')}`);
    }
  });
  return parts.join(' | ');
}

function buildPayload(){
  const avail=answers['availability']||{};
  const sel=answers['processes']||[];
  const processTimes={};
  sel.forEach(p=>{
    const key='time_'+p.replace(/[\s()]/g,'_');
    processTimes[p]=answers[key]==='Other'?(answers[key+'_other']||'Other'):(answers[key]||'');
  });
  const payload={
    leaving:answers['continuation']==='No — I do not wish to continue'?'YES — LEAVING':'',
    continuation:answers['continuation']||'',
    name:answers['name']||'',
    email:answers['email']||'',
    preferred_email:answers['preferred_email']||'',
    initials:answers['initials']||'',
    discord_username:answers['discord_username']||'',
    country:answers['country']||'',
    timezone:answers['timezone']==='Other'?(answers['timezone_other']||'Other'):(answers['timezone']||''),
    years_with_pff:answers['years']||'',
    right_to_work:answers['right_to_work']||'',
    slack_confirm:answers['slack_confirm']||'',
    docs_confirm:answers['docs_confirm']||'',
    processes:sel.join(', '),
    processes_learning:(answers['processes_learning']||[]).join(', '),
    process_times:JSON.stringify(processTimes),
    total_games_last_season:answers['total_games_last_season']||'',
    avg_games_per_week:answers['avg_games_per_week']||'',
    preferred_games_per_week:answers['preferred_games_per_week']||'',
    workload_preference:answers['workload_preference']||'',
    ideal_schedule:buildSchedulePayload(),
    schedule_notes:answers['schedule_notes']||'',
    dual_monitor:answers['dual_monitor']||'',
    os:answers['os']||'',
    hardware_notes:answers['hardware_notes']||'',
    questions_for_us:answers['questions_for_us']||'',
    submitted_at:new Date().toISOString(),
  };
  DAYS.forEach(d=>payload['avail_'+d.toLowerCase()]=avail[d]||'');
  return payload;
}

async function submitForm(){
  if(submitting)return;
  submitting=true;
  const btn=document.getElementById('btn-next');
  if(btn){btn.innerHTML='<span class="spinner"></span>Submitting...';btn.disabled=true;}

  const payload=buildPayload();
  let success=false;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const res=await fetch(SHEET_URL+'?data='+encodeURIComponent(JSON.stringify(payload)),{method:'GET'});
      if(res.ok||res.status===0){success=true;break;}
    }catch(e){
      if(attempt===3)break;
      await new Promise(r=>setTimeout(r,1000*attempt));
    }
  }

  if(success){
    showDone();
  }else{
    submitting=false;
    if(btn){btn.innerHTML='Submit Form';btn.disabled=false;}
    const err=document.getElementById('err-msg');
    if(err){err.textContent='Something went wrong — please try again.';err.style.display='block';}
  }
}


function showDone(){
  document.getElementById('page-form').style.display='none';
  document.getElementById('page-done').style.display='block';
  const first=(answers['name']||'').split(' ')[0];
  const cont=answers['continuation']||'';
  const isNo=cont==='No — I do not wish to continue';
  const hasQuestions=cont==='I have questions before I can decide';
  document.getElementById('page-done').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:3rem 0 2rem">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(26,106,255,0.15);border:2px solid rgba(26,106,255,0.5);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:28px;color:#1A6AFF;font-weight:800">&#10003;</div>
    <h1 style="color:#fff;font-size:28px;font-weight:800;margin:0 0 0.5rem">${isNo?'Thank you for letting us know.':`You're all set${first?', '+first:''}.`}</h1>
    <p style="color:#9ca3af;font-size:15px">${isNo?'Your response has been received.':'Onboarding form complete — thank you.'}</p>
  </div>
  ${isNo?`
  <div class="card" style="text-align:center">
    <p style="color:#d1d5db;font-size:15px;line-height:1.7;margin-bottom:1rem">We are sorry to be losing you and are truly grateful for everything you contributed during your time with PFF. We will remove you from our mailing lists so you will not continue receiving updates and availability forms going forward.</p>
    <p style="color:#d1d5db;font-size:15px;line-height:1.7">If you would be open to sharing a little more about your decision, we would love to hear from you — please feel free to email <a href="mailto:schester@teamworks.com" style="color:#1A6AFF">schester@teamworks.com</a> to arrange a time to chat.</p>
  </div>`:`
  <div class="card" style="border-color:rgba(26,106,255,0.3);background:rgba(26,106,255,0.04);margin-bottom:1.5rem">
    <p style="color:#d1d5db;font-size:15px;line-height:1.7">Your information has been received. Two things still to complete when you hear from us:</p>
  </div>
  <div class="action-box"><div class="action-num">2</div><div class="action-text"><strong>Join Slack</strong> — invite coming separately. Discord will be retired before the season. <span style="color:#9ca3af;font-size:13px">Allow up to 2 weeks as the workspace is being set up.</span></div></div>
  <div class="action-box"><div class="action-num">3</div><div class="action-text"><strong>Sign your HR documents</strong> — these will be sent to you by Teamworks shortly. <span style="color:#9ca3af;font-size:13px">Allow up to 2 weeks — Teamworks will send these once all onboarding forms have been received.</span></div></div>
  ${hasQuestions?`
  <div class="card" style="border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.04);margin-top:1.5rem">
    <p style="color:#f59e0b;font-weight:700;font-size:14px;margin-bottom:0.5rem">YOU HAVE QUESTIONS</p>
    <p style="color:#d1d5db;font-size:15px;line-height:1.7">You indicated you had some questions before confirming whether you would like to continue with us at Teamworks. Please email <a href="mailto:schester@teamworks.com" style="color:#1A6AFF">schester@teamworks.com</a> to arrange a time to chat — we will do our best to answer anything you would like to talk through.</p>
  </div>`:''}
  <div class="card" style="margin-top:1.5rem;text-align:center">
    <p style="color:#9ca3af;font-size:14px">Questions? Get in touch: <a href="mailto:schester@teamworks.com" style="color:#1A6AFF">schester@teamworks.com</a></p>
  </div>`}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

renderWelcome();
</script>

</html>
