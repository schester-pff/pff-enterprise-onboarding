<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teamworks Transition and Survey — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* primary action accent — Teamworks Operations Blue */
  --yellow:#1A6AFF; --yellow-soft:rgba(26,106,255,0.14); --yellow-border:rgba(26,106,255,0.32); --yellow-ink:#5B95FF;
  /* highlight / selected state — electric lime */
  --lime:#65C332; --lime-ink:#7CD948; --lime-soft:rgba(101,195,50,0.12); --lime-border:rgba(101,195,50,0.45);
  /* status */
  --green:#3FB950; --green-soft:rgba(63,185,80,0.12);
  --red:#F87171; --red-soft:rgba(248,113,113,0.13);
  /* radii */
  --radius:14px; --radius-sm:10px; --radius-xs:6px;
  /* easing */
  --ease:cubic-bezier(0.4,0,0.2,1); --ease-out:cubic-bezier(0.16,1,0.3,1);
  /* surfaces & text (dark) */
  --bg:#0B0F18; --surface:#141B2A; --surface-2:#1B2335; --surface-3:#232B40;
  --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.12);
  --text:#ECEEF3; --text-mute:#8A93A6; --text-faint:#5B6478;
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 14px 40px rgba(0,0,0,0.45);
  --shadow-soft:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.25);
  --grid-line:rgba(26,106,255,0.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
.overlay{display:none}
.container{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:0 1rem 4rem}
.logo{display:flex;align-items:center;justify-content:center;padding:2rem 0 1rem}
.hero{text-align:center;padding:2rem 0 1.5rem}
.hero h1{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;margin:0 0 0.5rem;letter-spacing:-0.5px;color:var(--text)}
.hero .sub{color:var(--yellow);font-size:18px;margin:0 0 0.5rem;font-weight:600}
.hero .meta{color:var(--text-mute);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem;box-shadow:var(--shadow-soft)}
.action-box{background:var(--yellow-soft);border:1px solid var(--yellow-border);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin-bottom:0.75rem;display:flex;align-items:flex-start;gap:12px}
.action-num{background:var(--yellow);color:#fff;font-family:'DM Mono',monospace;font-weight:500;font-size:12px;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.action-text{color:var(--text);font-size:14px;line-height:1.6}
.action-text strong{color:#fff}
.cta-box{background:linear-gradient(135deg,var(--yellow-soft),rgba(26,106,255,0.04));border:1px solid var(--yellow-border);border-radius:var(--radius);padding:2.5rem;text-align:center;margin:2rem 0;box-shadow:var(--shadow)}
.btn-primary{background:var(--yellow);color:#fff;border:none;padding:1rem 3rem;border-radius:var(--radius-sm);font-size:17px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:0.2px;transition:transform .12s var(--ease),background .18s var(--ease)}
.btn-primary:hover{background:var(--yellow-ink);transform:translateY(-1px)}
.screener-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;box-shadow:var(--shadow-soft)}
.q-label{display:block;color:#fff;font-weight:500;margin-bottom:0.75rem;line-height:1.6;font-size:15px;white-space:pre-line}
.q-num{color:var(--yellow);font-family:'DM Mono',monospace;font-size:12px;font-weight:500;margin-right:8px}
.q-hint{color:var(--text-mute);font-size:12px;margin-top:6px;font-style:italic}
.radio-opt{display:flex;align-items:center;gap:12px;cursor:pointer;padding:0.75rem 1rem;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);margin-bottom:8px;transition:background .18s var(--ease),border-color .18s var(--ease)}
.radio-opt:hover{background:var(--surface-3)}
.radio-opt.selected{background:var(--lime-soft);border-color:var(--lime-border)}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio-opt.selected .radio-dot{border-color:var(--lime);background:var(--lime)}
.radio-inner{width:7px;height:7px;border-radius:50%;background:#fff}
.radio-text{color:var(--text);font-size:15px}
.radio-opt.selected .radio-text{color:#fff}
select.q-select,input.q-text,textarea.q-textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:0.75rem 1rem;color:var(--text);font-size:15px;outline:none;font-family:'DM Sans',system-ui,sans-serif;transition:border-color .18s var(--ease)}
select.q-select:focus,input.q-text:focus,textarea.q-textarea:focus{border-color:var(--yellow-border)}
select.q-select option{background:var(--surface);color:#fff}
textarea.q-textarea{resize:vertical;line-height:1.6}
.check-btn{padding:0.5rem 0.875rem;font-size:13px;background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s var(--ease),border-color .15s var(--ease);margin:4px}
.check-btn:hover{background:var(--surface-3)}
.check-btn.selected{background:var(--lime-soft);color:var(--lime-ink);border-color:var(--lime-border)}
.check-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check-grid .check-btn{margin:0;text-align:center;justify-content:center;display:flex;align-items:center}
@media(max-width:600px){.check-grid{grid-template-columns:repeat(2,1fr)}}
.info-box.lime{background:var(--lime-soft);border-color:var(--lime-border)}
.info-box.lime p{color:var(--lime-ink)}
.avail-grid{display:grid;gap:8px}
.avail-row{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px;padding:0.6rem 0.875rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm)}
.avail-day{color:var(--yellow);font-family:'DM Mono',monospace;font-size:13px;font-weight:500}
.avail-opts{display:flex;flex-wrap:wrap;gap:6px}
.avail-btn{padding:3px 8px;font-size:11px;background:var(--surface-3);color:var(--text-mute);border:1px solid var(--line);border-radius:var(--radius-xs);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s var(--ease),border-color .15s var(--ease)}
.avail-btn:hover{background:var(--line-strong)}
.avail-btn.selected{background:var(--lime-soft);color:var(--lime-ink);border-color:var(--lime-border)}
.q-block{margin-bottom:2rem}
.progress-bar-bg{background:var(--surface-3);border-radius:8px;height:6px;overflow:hidden;max-width:400px;margin:0 auto 0.5rem}
.progress-bar{height:100%;background:var(--lime);border-radius:8px;transition:width 0.4s var(--ease)}
.nav-row{display:flex;gap:12px;margin-top:1rem}
.btn-back{padding:0.875rem 1.5rem;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--text);cursor:pointer;font-size:15px;font-family:'DM Sans',sans-serif;transition:background .18s var(--ease)}
.btn-back:hover{background:var(--surface-3)}
.btn-next{flex:1;padding:0.875rem;background:var(--yellow);border:none;border-radius:var(--radius-sm);color:#fff;font-weight:600;cursor:pointer;font-size:16px;font-family:'DM Sans',sans-serif;transition:background .18s var(--ease)}
.btn-next:hover:not(:disabled){background:var(--yellow-ink)}
.btn-next:disabled{opacity:0.6;cursor:not-allowed}
.error-msg{color:var(--red);text-align:center;margin-bottom:1rem;font-size:14px}
.hint{color:var(--text-mute);font-size:12px;text-align:center;margin-top:0.75rem}
.info-box{background:var(--yellow-soft);border:1px solid var(--yellow-border);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin-bottom:1.5rem}
.info-box p{color:var(--yellow-ink);font-size:14px;line-height:1.7}
.schedule-reference{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.5rem;overflow-x:auto}
.schedule-reference h3{color:var(--yellow);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;margin-bottom:0.75rem;text-transform:uppercase}
.ref-table{width:100%;border-collapse:collapse;min-width:580px}
.ref-table th{background:var(--yellow-soft);color:var(--yellow);font-weight:700;padding:6px 8px;text-align:left;font-size:11px;letter-spacing:0.3px;border:1px solid var(--yellow-border)}
.ref-table td{padding:5px 8px;color:var(--text);border:1px solid var(--line);vertical-align:top;font-size:11px}
.ref-table tr:nth-child(even) td{background:rgba(255,255,255,0.02)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;overflow-x:auto;min-width:0}
.grid-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid-day-header{background:var(--yellow-soft);color:var(--yellow);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;padding:5px 4px;border-radius:var(--radius-xs);text-align:center;letter-spacing:0.3px}
.grid-slots{display:flex;flex-direction:column;gap:4px}
.grid-slot{position:relative}
.slot-select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-xs);padding:4px 2px;color:var(--text-mute);font-size:11px;outline:none;font-family:'DM Sans',system-ui,sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.slot-select option{background:var(--surface);color:#fff}
.grid-slot.filled .slot-select{border-color:var(--lime-border);background:var(--lime-soft);color:#fff}
.btn-add-slot{background:transparent;border:1px dashed var(--line-strong);border-radius:var(--radius-xs);color:var(--text-mute);font-size:10px;padding:3px 2px;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;transition:border-color .15s var(--ease),color .15s var(--ease);margin-top:2px}
.btn-add-slot:hover{border-color:var(--lime-border);color:var(--lime-ink)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.hero h1{font-size:24px}.avail-row{grid-template-columns:1fr}.day-tab{padding:0.4rem 0.6rem;font-size:12px}}
</style>
</head>

function renderWelcome(){
  document.getElementById('page-welcome').innerHTML=`

function buildSections(){
  const sel=answers['processes']||[];

      {id:"processes_learning",text:"Which processes are you training in this offseason?\nSelect all that apply.",type:"multicheck",opts:[...PROCESSES,"None"]},
      {id:"total_games_last_season",text:"How many game assignments did you work in total last season?",type:"select",opts:TOTAL_GAMES_OPTS},
      {id:"avg_games_per_week",text:"On average, how many game assignments did you work per week last season?",type:"select",opts:AVG_WEEKLY_OPTS},
      {id:"preferred_games_per_week",text:"If you could choose, how many game assignments would you ideally like to work per week this season?",type:"select",opts:AVG_WEEKLY_OPTS},
      {id:"workload_preference",text:"What would you like your overall workload to look like this season compared to last?",type:"radio",opts:["Fewer game assignments than last season","About the same as last season","More game assignments than last season"]},
    ]},
    ...(hasProcs?[{title:"Section 3 — Time Per Process",isTimeSection:true,qs:processTimeQs}]:[]),
    {title:`Section ${3+n} — Availability`,qs:[
      {id:"availability",text:"For each day of the week, select the number of hours you are typically available to work.\nThis helps us with scheduling — please be as accurate as possible.",type:"availability"},
    ]},
    {title:`Section ${4+n} — Ideal Weekly Schedule`,isSchedule:true,qs:[]},
    {title:`Section ${5+n} — Equipment`,qs:[
      {id:"dual_monitor",text:"Do you use a dual monitor setup when collecting data for games?",type:"radio",opts:["Yes","No"]},
      {id:"os",text:"What operating system do you use?",type:"radio",opts:OS_OPTS},
      {id:"slack_confirm",text:"I understand I need to join Slack before the 2026 season and will do so when I receive my invite.",type:"radio",opts:["Yes, I confirm","I have questions about this"]},
      {id:"questions_for_us",text:"Do you have any questions for us?\nIf so, please use the box below and we will do our best to get back to you.",type:"textarea",ph:"Type your question here — or leave blank if you have nothing to ask right now.",optional:true},
    ]},
  ];
}


function getAvailableProcesses(){
  const trained=answers['processes']||[];
  const learning=answers['processes_learning']||[];
  const combined=[...new Set([...trained,...learning])];
  return combined.filter(p=>p&&p!=='None');
}

function renderScheduleSection(s,prog,isLast){
  const availProcs=getAvailableProcesses();
  const days=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];

  // Build reference table
  const maxRows=Math.max(...Object.values(SCHEDULE_DATA).map(a=>a.length));
  let tableRows='';
  for(let i=0;i<maxRows;i++){
    tableRows+=`<tr>${days.map(d=>`<td>${SCHEDULE_DATA[d][i]||''}</td>`).join('')}</tr>`;
  }

  // Build grid columns — one per day
  const procOpts=availProcs.length===0
    ?`<option value="">— No processes —</option>`
    :`<option value=""></option>${availProcs.map(p=>`<option value="${p}">${p}</option>`).join('')}`;

  const gridCols=days.map(day=>{
    const slots=schedule[day];
    const displayCount=Math.max(5,slots.length);
    let slotsHtml='';
    for(let i=0;i<displayCount;i++){
      const val=slots[i]?slots[i].process:'';
      const filled=!!val;
      slotsHtml+=`<div class="grid-slot${filled?' filled':''}">
        <select class="slot-select" data-day="${day}" data-idx="${i}" onchange="setSlot('${day}',${i},this.value)">
          <option value=""></option>${availProcs.map(p=>`<option value="${p}"${val===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </div>`;
    }
    return`<div class="grid-col">
      <div class="grid-day-header">${day}</div>
      <div class="grid-slots" id="slots-${day}">${slotsHtml}</div>
      <button class="btn-add-slot" onclick="addSlot('${day}')">+ Add slot</button>
    </div>`;
  }).join('');

  document.getElementById('page-form').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:1.5rem 0 1rem">
    <h2 style="font-family:'Syne',sans-serif;color:#fff;font-size:22px;font-weight:700;margin:0 0 1rem">${s.title}</h2>
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${prog}%"></div></div>
    <p style="color:var(--text-mute);font-size:13px">Section ${currentSec+1} of ${buildSections().length} — ${s.title}</p>
  </div>
  <div class="screener-card">
    <h3 style="font-family:'Syne',sans-serif;color:var(--yellow);font-size:17px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(255,255,255,0.1)">${s.title}</h3>
    <p style="color:var(--text);font-size:14px;line-height:1.7;margin-bottom:1.25rem">Use the grid below to build your ideal weekly schedule. Each slot represents one game assignment — select a process from the dropdown. Add as many slots as you like on any day using the button at the bottom of that column. This is your ideal — be as ambitious as you like, there are no wrong answers.</p>

    <div class="schedule-reference">
      <h3>Process in-season days worked — for reference</h3>
      <div style="overflow-x:auto">
        <table class="ref-table">
          <thead><tr>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>

    ${availProcs.length===0?`<div class="info-box"><p>You have not selected any processes in Section 3. Go back and select the processes you are trained in or learning this offseason — they will then appear here.</p></div>`:''}

    <p style="color:var(--text-mute);font-size:13px;line-height:1.6;margin-bottom:0.75rem">Each slot represents one full game assignment. If you want multiple games in the same process on the same day, just fill multiple slots with that process. Leave slots blank on days you do not want to work, or if you only want a limited number of games that day.</p>

    <div class="week-grid" id="week-grid">${gridCols}</div>

    <div class="q-block" style="margin-top:1.5rem;margin-bottom:0">
      <label class="q-label">Any additional notes about your schedule preferences?<br><span style="color:var(--text-mute);font-size:13px;font-weight:400">e.g. half games vs full games, specific time windows, process combinations you prefer, anything else we should know.</span></label>
      <textarea class="q-textarea" rows="4" placeholder="Optional — leave blank if you have nothing to add." oninput="setAnswer('schedule_notes',this.value)">${answers['schedule_notes']||''}</textarea>
    </div>
  </div>
  <div id="err-msg" class="error-msg" style="display:none">Please answer all required questions before continuing.</div>
  <div class="nav-row">
    <button class="btn-back" onclick="${currentSec>0?'prevSec()':'backToWelcome()'}">Back</button>
    <button class="btn-next" id="btn-next" onclick="nextOrSubmit()">${isLast?'Submit Form':'Next Section'}</button>
  </div>
  <p class="hint">All required questions must be answered before proceeding</p>`;
}

function setSlot(day,idx,val){
  if(!schedule[day])schedule[day]=[];
  while(schedule[day].length<=idx)schedule[day].push({process:''});
  schedule[day][idx]={process:val};
  // Just toggle the filled class on the parent slot div — no re-render
  const container=document.getElementById('slots-'+day);
  if(container){
    const slotDivs=container.querySelectorAll('.grid-slot');
    if(slotDivs[idx]){
      if(val){slotDivs[idx].classList.add('filled');}
      else{slotDivs[idx].classList.remove('filled');}
    }
  }
}

function addSlot(day){
  if(!schedule[day])schedule[day]=[];
  schedule[day].push({process:''});
  const idx=schedule[day].length-1;
  const availProcs=getAvailableProcesses();
  const container=document.getElementById('slots-'+day);
  if(!container)return;
  const div=document.createElement('div');
  div.className='grid-slot';
  const sel=document.createElement('select');
  sel.className='slot-select';
  sel.setAttribute('data-day',day);
  sel.setAttribute('data-idx',idx);
  sel.onchange=function(){setSlot(day,idx,this.value);};
  const emptyOpt=document.createElement('option');
  emptyOpt.value='';
  sel.appendChild(emptyOpt);
  availProcs.forEach(p=>{
    const opt=document.createElement('option');
    opt.value=p;opt.textContent=p;
    sel.appendChild(opt);
  });
  div.appendChild(sel);
  container.appendChild(div);
}


function showForm(){
  document.getElementById('page-welcome').style.display='none';
  document.getElementById('page-form').style.display='block';
  currentSec=0;renderSection();window.scrollTo({top:0,behavior:'smooth'});
}

function renderSection(){
  const sections=buildSections();
  const s=sections[currentSec];
  const prog=Math.round(((currentSec+1)/sections.length)*100);
  const isLast=currentSec===sections.length-1;

  if(s.isSchedule){renderScheduleSection(s,prog,isLast);return;}

  let qNum=s.startNum||1;
  const qHtml=s.qs.map(q=>{
    if(q.type==='infolink')return`<div class="info-box"><p>Interested in learning a new All-22 process this offseason? <a href="https://profootballfocus.fillout.com/forms" target="_blank" rel="noopener" style="color:var(--yellow-ink);font-weight:600">Sign up here</a> — let us know which process you would like to add to your repertoire and we will be in touch with details.</p></div>`;
    const num=qNum++;
    const v=answers[q.id]||'';
    let input='';
    if(q.type==='radio'){
      input=q.opts.map(o=>`<div class="radio-opt${v===o?' selected':''}" onclick="setRadio('${q.id}','${o.replace(/'/g,"\\'").replace(/"/g,"&quot;")}',this)"><div class="radio-dot">${v===o?'<div class="radio-inner"></div>':''}</div><span class="radio-text">${o}</span></div>`).join('');
    }else if(q.type==='select'){
      input=`<select class="q-select" onchange="setAnswer('${q.id}',this.value);${q.id==='timezone'?'handleTimezoneOther(this.value)':''}"><option value="">Select...</option>${q.opts.map(o=>`<option value="${o}"${v===o?' selected':''}>${o}</option>`).join('')}</select>`;
      if(q.id==='timezone'&&v==='Other')input+=`<input class="q-text" type="text" placeholder="Please describe your time zone..." value="${answers['timezone_other']||''}" oninput="setAnswer('timezone_other',this.value)" style="margin-top:10px">`;
    }else if(q.type==='text'){
      input=`<input class="q-text" type="text" placeholder="${q.ph||''}" value="${v}" oninput="setAnswer('${q.id}',this.value)">`;
      if(q.optional)input+=`<p class="q-hint">Optional</p>`;
    }else if(q.type==='textarea'){
      input=`<textarea class="q-textarea" rows="4" placeholder="${q.ph||''}" oninput="setAnswer('${q.id}',this.value)">${v}</textarea>`;
      if(q.optional)input+=`<p class="q-hint">Optional</p>`;
    }else if(q.type==='initials'){
      input=`<input class="q-text" type="text" value="${v}" maxlength="3" oninput="setInitials(this)" style="text-transform:uppercase;letter-spacing:4px;font-size:20px;font-weight:700;max-width:120px"><p class="q-hint">2 or 3 letters</p>`;
    }else if(q.type==='multicheck'){
      const arr=answers[q.id]||[];
      input=`<div class="check-grid">${q.opts.map(o=>`<button class="check-btn${arr.includes(o)?' selected':''}" onclick="toggleCheck('${q.id}','${o}')">${o}</button>`).join('')}</div>`;
    }else if(q.type==='processtime'){
      const opts=PROCESS_TIMES[q.process]||[];
      input=`<select class="q-select" onchange="setAnswer('${q.id}',this.value);handleProcessTimeOther('${q.id}',this.value)"><option value="">Select...</option>${opts.map(o=>`<option value="${o}"${v===o?' selected':''}>${o}</option>`).join('')}</select>`;
      if(v==='Other')input+=`<input class="q-text" type="text" placeholder="Please describe your typical game time..." value="${answers[q.id+'_other']||''}" oninput="setAnswer('${q.id+'_other'}',this.value)" style="margin-top:10px">`;
    }else if(q.type==='availability'){
      const av=answers['availability']||{};
      input=`<div class="avail-grid">${DAYS.map(d=>`<div class="avail-row"><span class="avail-day">${d}</span><div class="avail-opts">${HOURS.map(h=>`<button class="avail-btn${av[d]===h?' selected':''}" onclick="setAvail('${d}','${h.replace(/'/g,"\\'")}')">${h}</button>`).join('')}</div></div>`).join('')}</div>`;
    }
    return`<div class="q-block"><label class="q-label"><span class="q-num">${num}.</span>${q.text}</label>${input}</div>`;
  }).join('');

  const timeSectionNote=s.isTimeSection?`<div class="info-box lime" style="margin-bottom:1.5rem"><p>How long does it take you to complete a normal game assignment in each process listed below? If you are more used to doing half games, please double your time when filling in that section.</p><p style="margin-top:0.75rem">Please be honest with this. If we are going to give you multiple games in a day, we need to understand how long each assignment actually takes you — so we do not overload your schedule, or shortchange you if you work faster than average.</p></div>`:'';

  document.getElementById('page-form').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:1.5rem 0 1rem">
    <h2 style="font-family:'Syne',sans-serif;color:#fff;font-size:22px;font-weight:700;margin:0 0 1rem">${s.title}</h2>
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${prog}%"></div></div>
    <p style="color:var(--text-mute);font-size:13px">Section ${currentSec+1} of ${sections.length} — ${s.title}</p>
  </div>
  <div class="screener-card">
    <h3 style="font-family:'Syne',sans-serif;color:var(--yellow);font-size:17px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(255,255,255,0.1)">${s.title}</h3>
    ${timeSectionNote}
    ${qHtml}
  </div>
  <div id="err-msg" class="error-msg" style="display:none">Please answer all required questions before continuing.</div>
  <div class="nav-row">
    <button class="btn-back" onclick="${currentSec>0?'prevSec()':'backToWelcome()'}">Back</button>
    <button class="btn-next" id="btn-next" onclick="nextOrSubmit()">${isLast?'Submit Form':'Next Section'}</button>
  </div>
  <p class="hint">All required questions must be answered before proceeding</p>`;
}


function handleTimezoneOther(val){if(val!=='Other')answers['timezone_other']='';renderSection();}
function handleProcessTimeOther(id,val){if(val!=='Other')answers[id+'_other']='';renderSection();}
function setInitials(el){const val=el.value.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,3);el.value=val;answers['initials']=val;}
function setRadio(id,val,el){
  answers[id]=val;
  el.closest('.screener-card').querySelectorAll('.radio-opt').forEach(o=>{if(o.closest('.q-block')===el.closest('.q-block')){o.classList.remove('selected');o.querySelector('.radio-dot').innerHTML='';}});
  el.classList.add('selected');el.querySelector('.radio-dot').innerHTML='<div class="radio-inner"></div>';
}
function setAnswer(id,val){answers[id]=val;}
function setAvail(day,hrs){if(!answers['availability'])answers['availability']={};answers['availability'][day]=hrs;renderSection();}
function toggleCheck(id,val){
  let arr=answers[id]||[];
  if(arr.includes(val)){arr=arr.filter(x=>x!==val);}
  else if(val==='None'){arr=['None'];}
  else{arr=[...arr.filter(x=>x!=='None'),val];}
  answers[id]=arr;renderSection();
}

function secComplete(){
  const sections=buildSections();
  const s=sections[currentSec];
  if(s.isSchedule)return true; // schedule section is optional
  return s.qs.every(q=>{
    if(q.type==='infolink')return true;
    if(q.optional)return true;
    if(q.type==='multicheck')return(answers[q.id]||[]).length>0;
    if(q.type==='availability'){const av=answers['availability']||{};return DAYS.every(d=>av[d]);}
    if(q.type==='initials')return(answers[q.id]||'').length>=2;
    if(q.type==='processtime'){
      if(!answers[q.id])return false;
      if(answers[q.id]==='Other')return(answers[q.id+'_other']||'').trim().length>0;
      return true;
    }
    return answers[q.id]!==undefined&&answers[q.id]!=='';
  });
}

function nextOrSubmit(){
  if(!secComplete()){
    const err=document.getElementById('err-msg');
    if(err){err.style.display='block';}
    return;
  }
  if(currentSec===0&&answers['continuation']==='No — I do not wish to continue'){submitForm();return;}
  const sections=buildSections();
  if(currentSec===sections.length-1){submitForm();return;}
  currentSec++;renderSection();window.scrollTo({top:0,behavior:'smooth'});
}

function prevSec(){currentSec--;renderSection();window.scrollTo({top:0,behavior:'smooth'});}
function backToWelcome(){document.getElementById('page-form').style.display='none';document.getElementById('page-welcome').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}

function buildSchedulePayload(){
  const parts=[];
  Object.entries(schedule).forEach(([day,slots])=>{
    const filled=slots.filter(s=>s&&s.process);
    if(filled.length>0){
      parts.push(`${day}: ${filled.map(s=>s.process).join(', ')}`);
    }
  });
  return parts.join(' | ');
}

function buildPayload(){
  const avail=answers['availability']||{};
  const sel=answers['processes']||[];
  const processTimes={};
  sel.forEach(p=>{
    const key='time_'+p.replace(/[\s()]/g,'_');
    processTimes[p]=answers[key]==='Other'?(answers[key+'_other']||'Other'):(answers[key]||'');
  });
  const payload={
    leaving:answers['continuation']==='No — I do not wish to continue'?'YES — LEAVING':'',
    continuation:answers['continuation']||'',
    name:answers['name']||'',
    email:answers['email']||'',
    preferred_email:answers['preferred_email']||'',
    initials:answers['initials']||'',
    country:answers['country']||'',
    timezone:answers['timezone']==='Other'?(answers['timezone_other']||'Other'):(answers['timezone']||''),
    years_with_pff:answers['years']||'',
    slack_confirm:answers['slack_confirm']||'',
    processes:sel.join(', '),
    processes_learning:(answers['processes_learning']||[]).join(', '),
    process_times:JSON.stringify(processTimes),
    total_games_last_season:answers['total_games_last_season']||'',
    avg_games_per_week:answers['avg_games_per_week']||'',
    preferred_games_per_week:answers['preferred_games_per_week']||'',
    workload_preference:answers['workload_preference']||'',
    ideal_schedule:buildSchedulePayload(),
    schedule_notes:answers['schedule_notes']||'',
    dual_monitor:answers['dual_monitor']||'',
    os:answers['os']||'',
    questions_for_us:answers['questions_for_us']||'',
    submitted_at:new Date().toISOString(),
  };
  DAYS.forEach(d=>payload['avail_'+d.toLowerCase()]=avail[d]||'');
  return payload;
}

async function submitForm(){
  if(submitting)return;
  submitting=true;
  const btn=document.getElementById('btn-next');
  if(btn){btn.innerHTML='<span class="spinner"></span>Submitting...';btn.disabled=true;}

  const payload=buildPayload();
  let success=false;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const res=await fetch(SHEET_URL+'?data='+encodeURIComponent(JSON.stringify(payload)),{method:'GET'});
      if(res.ok||res.status===0){success=true;break;}
    }catch(e){
      if(attempt===3)break;
      await new Promise(r=>setTimeout(r,1000*attempt));
    }
  }

  if(success){
    showDone();
  }else{
    submitting=false;
    if(btn){btn.innerHTML='Submit Form';btn.disabled=false;}
    const err=document.getElementById('err-msg');
    if(err){err.textContent='Something went wrong — please try again.';err.style.display='block';}
  }
}


function showDone(){
  document.getElementById('page-form').style.display='none';
  document.getElementById('page-done').style.display='block';
  const first=(answers['name']||'').split(' ')[0];
  const cont=answers['continuation']||'';
  const isNo=cont==='No — I do not wish to continue';
  document.getElementById('page-done').innerHTML=`
  ${logo()}
  <div style="text-align:center;padding:3rem 0 2rem">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--green-soft);border:2px solid rgba(63,185,80,0.5);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:28px;color:var(--green);font-weight:800">&#10003;</div>
    <h1 style="font-family:'Syne',sans-serif;color:#fff;font-size:28px;font-weight:800;margin:0 0 0.5rem">${isNo?'Thank you for letting us know.':`You're all set${first?', '+first:''}.`}</h1>
    <p style="color:var(--text-mute);font-size:15px">${isNo?'Your response has been received.':'Your response has been received — thank you.'}</p>
  </div>
  ${isNo?`
  <div class="card" style="text-align:center">
    <p style="color:var(--text);font-size:15px;line-height:1.7;margin-bottom:1rem">We are sorry to be losing you and are truly grateful for everything you contributed during your time with PFF. We will remove you from our mailing lists so you will not continue receiving updates and availability forms going forward.</p>
    <p style="color:var(--text);font-size:15px;line-height:1.7">If you would be open to sharing a little more about your decision, we would love to hear from you — please feel free to email <a href="mailto:schester@teamworks.com" style="color:var(--yellow-ink)">schester@teamworks.com</a> to arrange a time to chat.</p>
  </div>`:`
  <div class="card" style="border-color:var(--yellow-border);background:var(--yellow-soft);margin-bottom:1.5rem;text-align:center">
    <p style="color:var(--text);font-size:15px;line-height:1.7">Thanks for completing the Teamworks Transition and Survey form. Your information has been received and will help us plan for the season ahead.</p>
  </div>
  <div class="card" style="text-align:center">
    <p style="color:var(--text-mute);font-size:14px">Questions? Get in touch: <a href="mailto:schester@teamworks.com" style="color:var(--yellow-ink)">schester@teamworks.com</a></p>
  </div>`}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

renderWelcome();
</script>
</body>
</html>
